<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ APP_NAME }}{% endblock %}</title>
<link rel="icon" href="/static/logo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/"><img src="/static/logo-mark.svg" alt=""><span>Marge<b>Radar</b></span></a>
  <nav>
    <a href="/" class="{{ 'on' if nav == 'dashboard.html' }}">Pano</a>
    <a href="/opportunities" class="{{ 'on' if nav == 'opportunities.html' }}">Fırsatlar</a>
    <a href="/suppliers" class="{{ 'on' if nav == 'suppliers.html' }}">Tedarikçiler</a>
    <a href="/import" class="{{ 'on' if nav == 'import.html' }}">İçe aktar</a>
    <a href="/settings" class="{{ 'on' if nav == 'settings.html' }}">Ayarlar &amp; komisyonlar</a>
    <a href="/alerts" class="{{ 'on' if nav == 'alerts.html' }}">Uyarılar{% if unread_alerts %}<span class="badge-count">{{ unread_alerts }}</span>{% endif %}</a>
  </nav>
</div></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
